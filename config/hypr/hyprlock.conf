general {
    hide_cursor = false
}
background {
    monitor =
    path = /etc/boralances/wallpapers/dusk.png
    blur_passes = 1
    blur_size = 3
}
input-field {
    monitor =
    size = 340, 58
    outline_thickness = 1
    outer_color = rgba(8cbdff88)
    inner_color = rgba(132138ee)
    font_color = rgba(eef2ffff)
    placeholder_text = Password
    fail_text = Try again ($ATTEMPTS)
    rounding = 20
    position = 0, -100
    halign = center
    valign = center
}
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(eef2ffff)
    font_size = 22
    font_family = Inter
    position = 0, -10
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 82
    font_family = Inter
    position = 0, 220
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(e8eeffff)
    font_size = 20
    font_family = Inter
    position = 0, 310
    halign = center
    valign = center
}
label {
    monitor =
    text = BoralancesOS · Your workspace is waiting.
    color = rgba(cbd8eeff)
    font_size = 13
    font_family = Inter
    position = 0, 50
    halign = center
    valign = bottom
}
